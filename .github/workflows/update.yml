name: update-rates
on:
  schedule:
    - cron: "17 1,7,13,19 * * *"
  workflow_dispatch:
permissions:
  contents: write
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Fetch rates
        run: python fetch_rates.py
      - name: Commit (always, so the repo stays active and scheduled runs are not disabled)
        run: |
          date -u +"%Y-%m-%dT%H:%M:%SZ" > docs/last_run.txt
          git config user.name "rates-bot"
          git config user.email "rates-bot@users.noreply.github.com"
          git add docs
          git commit -m "Update rates $(date -u +%F)" || exit 0
          git push
